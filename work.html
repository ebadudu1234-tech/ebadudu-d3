<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — EBADUDU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="work">
<header class="top" id="top"></header>

<!-- the same works, two ways to look (SHELF / INDEX), filtered by a sentence -->
<main class="page work">
  <div class="work-head">
    <h1 class="big">The Shelf</h1>
    <div class="views" id="views" role="group" aria-label="View">
      <button class="btn" type="button" data-view="shelf" aria-pressed="true">SHELF</button>
      <button class="btn" type="button" data-view="index" aria-pressed="false">INDEX</button>
    </div>
  </div>
  <p class="filter" id="filter"></p>
  <div id="shelf-view"></div>
  <div id="index-view" hidden></div>
</main>
<!-- INDEX: the hovered row's cover rides next to the cursor -->
<div class="peek" id="peek" aria-hidden="true"><img alt=""></div>

<!-- shared on every page: the lid that closes over the box between pages, the yellow name-tag
     cursor, and the frog guide (all driven by main.js) -->
<div class="lid" id="lid" aria-hidden="true"><span class="lid-word">EBADUDU</span></div>
<div class="tag-cursor" id="tag-cursor" aria-hidden="true"></div>
<aside class="frog" id="frog" aria-hidden="true"><p class="bubble" id="bubble"></p><img src="assets/frog.png" alt=""></aside>

<script src="media.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
